<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TruthLens AI</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="header">
    <div class="logo">TruthLens AI</div>
    <div class="badge" id="status-badge">READY</div>
  </div>

  <div id="video-info" style="display: none; padding: 15px; border-bottom: 1px solid var(--border);">
    <div style="font-size: 0.8rem; color: var(--muted); margin-bottom: 4px;">Analyzing Video:</div>
    <div id="video-title" style="font-weight: 600; font-size: 0.9rem; line-height: 1.3;">[Title]</div>
  </div>

  <div class="main-content">
    
    <!-- INIT STATE -->
    <div id="init-state" class="state-panel active">
      <p style="color: var(--text-dim); text-align: center; margin-bottom: 20px;">Open a YouTube video to analyze its credibility.</p>
      <button id="analyze-btn" class="btn" disabled>Waiting for Video...</button>
    </div>

    <!-- LOADING STATE -->
    <div id="loading-state" class="state-panel">
      <div class="loader"></div>
      <p id="loading-text" style="color: var(--accent); margin-top: 15px; font-family: 'Space Mono', monospace; font-size: 0.85rem;">[1/5] Extracting Transcript...</p>
    </div>

    <!-- RESULT STATE -->
    <div id="result-state" class="state-panel">
      
      <div class="score-grid">
        <div class="metric-card" id="card-trust">
  <div class="metric-label">Trust Index</div>
  <div class="metric-value" id="val-trust">--%</div>
  <span class="metric-category" id="cat-trust" style="font-size:0.7rem; color:var(--text-dim);">--</span>
</div>
        <div class="metric-card" id="card-manip">
          <div class="metric-label">Manipulation</div>
          <div class="metric-value" id="val-manip">--%</div>
        </div>
        <div class="metric-card" id="card-viral">
          <div class="metric-label">Virality</div>
          <div class="metric-value" id="val-viral">--%</div>
        </div>
      </div>

      <!-- Verdict Conclusion Section -->
      <div id="ext-verdict-card" style="display: none; margin-top: 15px; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 6px; border: 1px solid var(--border);">
        <div class="metric-label" style="margin-bottom: 8px; font-size: 0.72rem; font-family: 'Space Mono', monospace; text-transform: uppercase;">Trust Assessment & Conclusion</div>
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
          <div id="ext-verdict-badge" style="font-size: 0.78rem; font-weight: 700; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; border: 1px solid currentColor;">--</div>
          <div id="ext-verdict-title" style="font-size: 0.82rem; font-weight: 600; color: var(--text);">--</div>
        </div>
        <p id="ext-verdict-explanation" style="font-size: 0.78rem; color: var(--text-dim); line-height: 1.45; margin: 0; max-height: 100px; overflow-y: auto; padding-right: 5px;"></p>
      </div>

      <div style="margin-top: 15px;">
        <div class="metric-label" style="margin-bottom: 8px;">Extracted Claims</div>
        <div id="claims-list" style="max-height: 120px; overflow-y: auto; background: var(--bg); padding: 10px; border-radius: 4px; font-size: 0.8rem; border: 1px solid var(--border);">
          <!-- Claims will go here -->
        </div>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
